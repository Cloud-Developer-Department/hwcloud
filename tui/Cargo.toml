[package]
name = "hwcloud-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Interactive TUI client for hwcloud, built on the Agent Client Protocol"

[[bin]]
name = "hwcloud-tui"
path = "src/main.rs"

[dependencies]
# Official ACP Rust SDK, stable v1 (matches Go server's ProtocolVersion: 1).
agent-client-protocol = "1.3"
# ratatui 0.29 is the current stable line (0.30 does not exist yet).
ratatui = "0.29"
# crossterm `event-stream` gives the async EventStream the UI loop polls.
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tui-textarea = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
